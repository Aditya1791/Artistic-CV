services:
  - type: web
    name: artcv-studio
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./artcv.db
      - key: JWT_SECRET
        generateValue: true
